services:
  - type: web
    name: a-little-love-test
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/setup
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOVE_APP_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
